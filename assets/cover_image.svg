<svg viewBox="0 0 680 384" width="100%" xmlns="http://www.w3.org/2000/svg">
  <title>UMKM OpsFlow Cover Image</title>
  <desc>Cover image for UMKM OpsFlow hackathon project - 16:9 format 680x384</desc>
  
  <!-- Background -->
  <rect width="680" height="384" fill="#0C447C"/>
  
  <!-- Decorative grid pattern -->
  <g opacity="0.08">
    <line x1="0" y1="48" x2="680" y2="48" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="96" x2="680" y2="96" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="144" x2="680" y2="144" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="192" x2="680" y2="192" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="240" x2="680" y2="240" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="288" x2="680" y2="288" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="336" x2="680" y2="336" stroke="#fff" stroke-width="1"/>
    <line x1="85" y1="0" x2="85" y2="384" stroke="#fff" stroke-width="1"/>
    <line x1="170" y1="0" x2="170" y2="384" stroke="#fff" stroke-width="1"/>
    <line x1="255" y1="0" x2="255" y2="384" stroke="#fff" stroke-width="1"/>
    <line x1="340" y1="0" x2="340" y2="384" stroke="#fff" stroke-width="1"/>
    <line x1="425" y1="0" x2="425" y2="384" stroke="#fff" stroke-width="1"/>
    <line x1="510" y1="0" x2="510" y2="384" stroke="#fff" stroke-width="1"/>
    <line x1="595" y1="0" x2="595" y2="384" stroke="#fff" stroke-width="1"/>
  </g>
  
  <!-- Left decorative shape -->
  <rect x="40" y="80" width="120" height="224" rx="12" fill="#185FA5" opacity="0.6"/>
  <rect x="60" y="100" width="80" height="40" rx="6" fill="#378ADD" opacity="0.8"/>
  <rect x="60" y="152" width="80" height="40" rx="6" fill="#378ADD" opacity="0.5"/>
  <rect x="60" y="204" width="80" height="40" rx="6" fill="#378ADD" opacity="0.3"/>
  <rect x="60" y="256" width="80" height="24" rx="6" fill="#378ADD" opacity="0.2"/>
  
  <!-- Center flow diagram -->
  <g transform="translate(200, 140)">
    <!-- Box 1: Input -->
    <rect x="0" y="0" width="80" height="48" rx="8" fill="#E24B4A" opacity="0.9"/>
    <text x="40" y="30" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="12" font-weight="500">CSV</text>
    
    <!-- Arrow 1 -->
    <line x1="80" y1="24" x2="110" y2="24" stroke="#85B7EB" stroke-width="2" marker-end="url(#arr)"/>
    
    <!-- Box 2: Parse -->
    <rect x="110" y="0" width="80" height="48" rx="8" fill="#1D9E75" opacity="0.9"/>
    <text x="150" y="30" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="12" font-weight="500">Parse</text>
    
    <!-- Arrow 2 -->
    <line x1="190" y1="24" x2="220" y2="24" stroke="#85B7EB" stroke-width="2" marker-end="url(#arr)"/>
    
    <!-- Box 3: Validate -->
    <rect x="220" y="0" width="80" height="48" rx="8" fill="#EF9F27" opacity="0.9"/>
    <text x="260" y="30" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="11" font-weight="500">Validate</text>
    
    <!-- Arrow 3 -->
    <line x1="300" y1="24" x2="330" y2="24" stroke="#85B7EB" stroke-width="2" marker-end="url(#arr)"/>
    
    <!-- Box 4: Report -->
    <rect x="330" y="0" width="80" height="48" rx="8" fill="#534AB7" opacity="0.9"/>
    <text x="370" y="30" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="11" font-weight="500">Report</text>
  </g>
  
  <!-- Main title -->
  <text x="340" y="260" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="36" font-weight="600">UMKM OpsFlow</text>
  
  <!-- Subtitle -->
  <text x="340" y="295" text-anchor="middle" fill="#85B7EB" font-family="sans-serif" font-size="16" font-weight="400">Agent laporan harian UMKM dari data berantakan</text>
  
  <!-- Hackathon badge -->
  <rect x="220" y="320" width="240" height="32" rx="16" fill="#fff" opacity="0.15"/>
  <text x="340" y="341" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="13" font-weight="500">Tencent Cloud Hackathon Indonesia 2026</text>
  
  <!-- Challenge badge -->
  <rect x="260" y="48" width="160" height="28" rx="14" fill="#EF9F27" opacity="0.9"/>
  <text x="340" y="67" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="12" font-weight="500">Challenge B: The Office Agent</text>
  
  <!-- Right decorative elements -->
  <circle cx="580" cy="120" r="40" fill="#1D9E75" opacity="0.2"/>
  <circle cx="620" cy="160" r="30" fill="#EF9F27" opacity="0.15"/>
  <circle cx="600" cy="280" r="50" fill="#E24B4A" opacity="0.1"/>
  
  <!-- Checkmark icon -->
  <circle cx="580" cy="200" r="24" fill="#1D9E75" opacity="0.8"/>
  <path d="M570 200 L576 206 L590 192" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#85B7EB" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
</svg>